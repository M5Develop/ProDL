version: '3.9'

services:
  backend:
    build: ./apps/backend
    ports:
      - "8000:8000"
    volumes:
      - /tmp/prodl_downloads:/tmp/prodl_downloads
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./apps/frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
